  CLEAN_W: 1.0,             // きれいにする幅（雫の直径の何倍か）
  FOG_RES: 1.5,             // くもりの絵の細かさ（世界の1単位あたりの点の数）
  SCENE_RES: 1.5,           // 場面の絵の細かさ
  REVEAL_FADE: 0.8,         // 場面が見える時、くもりが消えるまでの秒数

  ROCK_ESCAPE: 0.5,         // 壊せない岩と壁の角などで、この秒数動けなかったら、岩の上を越えて広い方へ出てくる（詰まないように）
  GOO_RESCUE_DELAY: 1.5,    // ねばねばに捕まってから、上に油の雫が現れるまでの秒数
  GOO_RESCUE_DIST: 160,     // 助けの油の雫が現れる高さ（プレイヤーの上）
  GOO_RESCUE_SPEED: 120,    // 助けの油の雫が流れてくる速さ
  GOO_OIL_SLOW: 0.8,        // 油がねばねばをすべり抜ける時の速さ（何倍か）
  STREAM_SPEED: 260,        // 水の流れの速さ
  STREAM_HW: 55,            // 水の流れの太さの半分
  STREAM_GRIP: 10,          // 流れにつかまる強さ（大きいほど、入った瞬間に流される）

  // --- ほかの雫（性質の雫）---
  OTHER_R: 11,              // ほかの雫の半径
  OTHER_SPEED: 14,          // ほかの雫がゆっくり流れる速さ
  OTHER_FORM_TIME: 0.5,     // ガラスに現れる時に、ふくらむ時間
  MERGE_TIME: 0.25,         // 触れてから、ひとつになるまでの時間

  // --- カメラ・終わり ---
  VIEW_MARGIN: 40,          // ガラスの上下に見せる余白
  END_WAIT: 1.2,            // 下の枠に着いてから、引き始めるまでの秒数
  ZOOM_TIME: 3.5,           // 窓全体まで引くのにかかる秒数

  // --- 音 ---
  VOLUME: 0.6,              // 全体の音量
  SLIDE_VOLUME: 0.012,      // 流れている間の小さな水の音（ご褒美の音が埋もれないよう、とても小さく）

// 性質ごとの動き。キーは性質を名前順に並べて「+」でつないだもの（'' は性質なし）。
//  fall: 傾けていない時に下へ流れる速さ（0 = 止まれる）　fallTilt: 傾けた時に増える下への速さ
//  side: いっぱいに傾けた時の横の速さ　sideResp/fallResp: 速さが変わる素早さ（小さいほど行き過ぎる・曲がりにくい）
//  curve: 傾きの効き方（1未満だと、少しの傾きでぐっと効く）　stop: 傾きを戻すと止まれる
//  stream: 水の流れに流される強さ　goo: ねばねばを抜けられる　rock: 削れる岩の固さ（1ふつう、2固い）
//  erode: 岩を削る速さ（1秒に、岩1つの何割か）　smash: 岩を一瞬で砕く　bounce: 壁で跳ね返る　wallStick: 壁や岩にくっつく
const STATES = {

  'honey+oil':   { fall: 0,   fallTilt: 110, side: 150, sideResp: 6,   fallResp: 6,   curve: 1,   stop: true,  stream: 1.2, goo: true },
  'oil+sand':    { fall: 150, fallTilt: 30,  side: 22,  sideResp: 0.7, fallResp: 2.5, curve: 0.5, stop: false, stream: 1.0, goo: true, rock: 1, smash: true },
  'honey+sand':  { fall: 0,   fallTilt: 28,  side: 35,  sideResp: 3,   fallResp: 4,   curve: 1,   stop: true,  stream: 0.08, rock: 1, erode: 0.7 },
  'oil+oil':     { fall: 120, fallTilt: 90,  side: 230, sideResp: 0.7, fallResp: 1.2, curve: 1,   stop: false, stream: 2.0, goo: true, bounce: 0.85 },
  'honey+honey': { fall: 0,   fallTilt: 18,  side: 48,  sideResp: 6,   fallResp: 6,   curve: 1,   stop: true,  stream: 0.03, wallStick: true },
  'sand+sand':   { fall: 125, fallTilt: 15,  side: 8,   sideResp: 1,   fallResp: 3,   curve: 0.5, stop: false, stream: 0.6, rock: 2, smash: true },
};

// 色
const COL = {
  wall: '#1b2027',
  frame: '#46505c',
  frameEdge: '#56616e',
  drop: '190,210,226',
  light: '238,245,250',
};
const PROP_RGB = { honey: [240, 172, 42], sand: [150, 104, 58], water: [205, 228, 245] }; // 油は虹色（時間で色が変わる）
const FRIEND_ALPHA = 0.7;

// ---------------------------------------------------------------------
//  小さな道具
// ---------------------------------------------------------------------
const C = CONFIG;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const easeOut = t => 1 - (1 - t) * (1 - t) * (1 - t);
const approach = (v, target, stepSize) => (v < target ? Math.min(target, v + stepSize) : Math.max(target, v - stepSize));
function angDiff(a, b) {
  let d = (b - a) % Math.PI;
  if (d > Math.PI / 2) d -= Math.PI;
  if (d < -Math.PI / 2) d += Math.PI;
  return d;
}
function prng(seed) { // いつも同じ並びになる乱数（見た目を毎回同じにするため）
  let s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}
function hslRGB(h, s, l) {
  const a = s * Math.min(l, 1 - l);
  const f = n => { const k = (n + h / 30) % 12; return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); };
  return [f(0), f(8), f(4)];
}
function propRGB(kind, phase) {
  if (kind === 'oil') return hslRGB(((performance.now() / 1000) * 90 + phase * 140) % 360, 0.75, 0.62);
  return PROP_RGB[kind];
}

// ---------------------------------------------------------------------
//  窓（世界）
// ---------------------------------------------------------------------
const W = C.PANE_W, H = C.PANE_H, STEP_Y = C.PANE_H + C.BAR;
const SILL_Y = C.PANE_COUNT * C.PANE_H + (C.PANE_COUNT - 1) * C.BAR;
const paneTop = k => k * STEP_Y;
const paneOf = y => clamp(Math.floor((y + C.BAR / 2) / STEP_Y), 0, C.PANE_COUNT - 1);

// ---------------------------------------------------------------------
//  ガラスごとの場面と障害物（座標は、そのガラスの中の位置。x: 0〜360、y: 0〜520）
//   scene: 向こうに見える部屋の絵
//   patches: 濃い汚れ [中心x, 中心y, 横の半径, 縦の半径]（どれか1つを拭けば場面が見える）
//   rocks: 岩 [x, y, 固さ（1 ふつう／2 固い）]　goo: ねばねば [左, 右, 上, 下]
//   streams: 水の流れ [始まりx, 始まりy, 終わりx, 終わりy]（始まりから終わりへ流れる）
//   drops: 性質の雫 [種類, x, y]（このガラスに入った時に現れる）
// ---------------------------------------------------------------------
function rockArc(cx, cy, R, a0, a1, stepDeg, hard) {
  const out = [];
  for (let a = a0; a <= a1 + 0.01; a += stepDeg) {
    const r = a * Math.PI / 180;
    out.push([cx + R * Math.cos(r), cy + R * Math.sin(r), hard]);
  }
  return out;
}
const LEVEL = [
  { // 1枚目：窓辺に立っている。見せる：通るときれいになり、場面が見える
    scene: 'window',
    patches: [[180, 375, 48, 72]],
  },
  { // 2枚目：テレビの前に座っている。岩を見せる（岩の真上に砂）
    scene: 'tv',
    patches: [[270, 388, 56, 44]],
    rocks: [...rockArc(268, 385, 80, 180, 360, 30, 1), [188, 425, 1], [190, 460, 1]],
    drops: [['sand', 268, 95], ['oil', 70, 130]],
  },
  { // 3枚目：机で何かを書いている。ねばねばを見せる（右のねばねばのふたの奥。左上に油）
    scene: 'desk',
    patches: [[282, 398, 58, 52]],
    goo: [[210, 354, 288, 318]],
    rocks: [[192, 328, 2], [192, 366, 2], [192, 404, 2], [192, 442, 2]],
    drops: [['oil', 200, 70]],
  },
  { // 4枚目：植物に水をやっている。流れを見せる（右上に水、その下に蜜）
    scene: 'plant',
    patches: [[305, 400, 42, 45]],
    streams: [[372, 255, 140, 292]],
    rocks: [[236, 318, 2], [236, 356, 2], [236, 394, 2], [236, 432, 2], [236, 468, 2]],
    drops: [['water', 250, 60], ['honey', 290, 130]],
  },
  { // 5枚目：ギターを弾いている。何を手放すか（左の岩には砂、右のねばねばには油）
    scene: 'guitar',
    patches: [[70, 392, 42, 38], [300, 392, 45, 38]],
    rocks: [...rockArc(70, 388, 58, 180, 360, 36, 1), [128, 425, 1], [128, 460, 1],
            [238, 330, 2], [238, 368, 2], [238, 406, 2], [238, 444, 2]],
    goo: [[255, 360, 290, 318]],
    drops: [['sand', 70, 70], ['water', 180, 140], ['honey', 300, 70]],
  },
  { // 6枚目：ベッドで眠っている。砂＋砂（固い岩）か、蜜（流れ）か。油＋蜜では届かない
    scene: 'bed',
    patches: [[80, 395, 42, 40], [305, 400, 42, 45]],
    rocks: [...rockArc(80, 392, 55, 180, 360, 36, 2), [135, 428, 2], [135, 462, 2],
            [245, 318, 2], [245, 356, 2], [245, 394, 2], [245, 432, 2], [245, 468, 2]],
    streams: [[372, 255, 175, 288]],
    drops: [['sand', 80, 60], ['sand', 80, 150]],
  },
];

// ます目（きれいにした量を数える）と、障害物を世界の座標にする
const NX = Math.ceil(W / C.CELL), NY = Math.ceil(H / C.CELL);
const PANES = LEVEL.map((L, k) => {
  const top = paneTop(k);
  const rnd = prng(31 + k * 17);
  const rocks0 = (L.rocks || []).map(([x, y, hard]) => {
    const n = 9, jag = [];
    for (let i = 0; i < n; i++) jag.push(0.82 + rnd() * 0.3); // 岩のごつごつ
    return { x, y: top + y, r: C.ROCK_R, hard, jag, rot: rnd() * TAU };
  });
  const goo = [];
  for (const [x0, x1, y0, y1] of L.goo || []) {
    for (let y = y0; y <= y1 + 0.1; y += 15) {
      for (let x = x0; x <= x1 + 0.1; x += 16) {
        goo.push({ x: x + (rnd() - 0.5) * 5, y: top + y + (rnd() - 0.5) * 5, r: 12 + rnd() * 4, ph: rnd() * TAU });
      }
    }
  }
  const streams = (L.streams || []).map(([x0, y0, x1, y1]) => {
    const len = Math.hypot(x1 - x0, y1 - y0);
    return { x0, y0: top + y0, x1, y1: top + y1, dx: (x1 - x0) / len, dy: (y1 - y0) / len, len };
  });
  const patches = (L.patches || []).map(([x, y, rx, ry]) => ({ x, y, rx, ry, cells: 0 }));
  // ます目の種類：0 以上＝その番号の濃い汚れ、-1＝ふつうのくもり、-2＝水の流れ（もともときれい）や窓の外
  const kind = new Int8Array(NX * NY);
  let normal = 0;
  for (let j = 0; j < NY; j++) {
    for (let i = 0; i < NX; i++) {
      const cx = (i + 0.5) * C.CELL, cy = (j + 0.5) * C.CELL;
      let v = -1;
      patches.forEach((pt, n) => { if (((cx - pt.x) / pt.rx) ** 2 + ((cy - pt.y) / pt.ry) ** 2 <= 1) v = n; });
      for (const s of streams) if (streamDist(s, cx, top + cy) <= C.STREAM_HW) v = -2;
      if (cy > H) v = -2;
      kind[j * NX + i] = v;
      if (v >= 0) patches[v].cells++; else if (v === -1) normal++;
    }
  }
  return {
    k, top, scene: L.scene, patches, rocks0, goo, streams,
    drops: (L.drops || []).map(([kind, x, y]) => ({ kind, x, y: top + y })),
    kind, normal,
  };
});
// 流れの中心線からの距離（流れの区間の外なら大きな値）
function streamDist(s, x, y) {
  const t = ((x - s.x0) * s.dx + (y - s.y0) * s.dy);
  if (t < 0 || t > s.len) return 1e9;
  const px = s.x0 + s.dx * t, py = s.y0 + s.dy * t;
  return Math.hypot(x - px, y - py);
}

// ---------------------------------------------------------------------
//  画面
// ---------------------------------------------------------------------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let sw = 0, sh = 0, dpr = 1, scale = 1;
function resize() {
  // 大きさが0の間（隠れた画面、読み込み途中のアプリ内ブラウザなど）は計算しない
  if (!(window.innerWidth > 0 && window.innerHeight > 0)) return;
  dpr = Math.min(2, window.devicePixelRatio || 1);
  sw = window.innerWidth; sh = window.innerHeight;
  canvas.width = Math.round(sw * dpr); canvas.height = Math.round(sh * dpr);
  canvas.style.width = sw + 'px'; canvas.style.height = sh + 'px';
  scale = Math.min(sw / (W + C.FRAME * 2 + 16), sh / (H + C.VIEW_MARGIN * 2)); // ガラス1枚が画面に入る大きさ
}
const makeCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
let sceneCanvas = [], fogCanvas = [];
function buildCanvases() {
  // 場面の絵（向こうの部屋）は、はじめに1回だけ描いておく
  sceneCanvas = PANES.map(P => {
    const c = makeCanvas(Math.round(W * C.SCENE_RES), Math.round(H * C.SCENE_RES));
    const g = c.getContext('2d');
    g.setTransform(C.SCENE_RES, 0, 0, C.SCENE_RES, 0, 0);
    drawScene(g, P.scene);
    return c;
  });
  // くもりの絵（1回ごとに描き直す。雫が通った所を消していく）
  fogCanvas = PANES.map(() => makeCanvas(Math.round(W * C.FOG_RES), Math.round(H * C.FOG_RES)));
}

let G = null;
let testTilt = null;     // 確かめ用：傾きを外から与える

const cam = { y: 0, zoom: 1 };

function makeDrop(x, y, r) {
  return {
    x, y, vx: 0, vy: 0, r,
    ang: 0, angT: 0, el: 0, elv: 0, elT: 0,
    lean: 0, jx: 0, jv: 0,
    resting: false, state: '', props: [],
    wx: x, wy: y, // くもりを消した最後の位置
  };
}

function newStats() {

    ejected: 0,                  // 押し出された・洗い流された性質の数

    revealed: PANES.map(() => false), revealT: PANES.map(() => null),

function newGame() {
  const sx = W * C.START_X, sy = H * C.START_Y;
  G = {
    t: 0, phase: 'stuck', waiting: ctrl.needTap, firstInput: -1, lastDir: 1, tilt: 0,
    hold: { startX: sx, anchorX: sx, anchorY: sy, offX: 0, offVX: 0, strain: 0, prevDir: 0 },
    player: makeDrop(sx, sy, C.STUCK_R),
    friend: makeDrop(-999, -999, C.FRIEND_R),
    side: Math.random() < 0.5 ? -1 : 1,
    transferT: 0, contactX: 0, contactY: 0, glowT: -1,
    releaseT: -1, moveT0: 0, moveRamp: C.FALL_ACCEL_TIME,

// ---------------------------------------------------------------------
//  操作：スマホは傾き、PC は ← →。どちらも「傾き t（-1〜1）」にする
// ---------------------------------------------------------------------
const ctrl = {

  dv: 0, sv: 0,      // 本体の傾き（そのまま／なめらかにしたもの）
  base: null,        // 「まっすぐ」とみなす本体の角度

{
  const want = (new URLSearchParams(location.search).get('ctrl') || '').toLowerCase();

// ---------------------------------------------------------------------
//  音（その場で作る効果音だけ）
// ---------------------------------------------------------------------
const Sound = {
  ac: null, master: null, slideGain: null, streamGain: null, noise: null, on: true,
  init() {

    try { this.ac = new AC(); } catch (_) { return; }

    const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), data = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; data[i] = last * 3.5; }
    const chain = (freq, q) => {
      const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;
      const g = ac.createGain(); g.gain.value = 0;
      src.connect(bp); bp.connect(g); g.connect(this.master); src.start();
      return g;
    };
    this.slideGain = chain(700, 0.7);   // 流れている間の小さな水の音
    this.streamGain = chain(1100, 0.5); // 水の流れの中にいる時の音
    const nlen = Math.floor(ac.sampleRate * 0.3);
    this.noise = ac.createBuffer(1, nlen, ac.sampleRate);
    const nd = this.noise.getChannelData(0);
    for (let i = 0; i < nlen; i++) nd[i] = Math.random() * 2 - 1;
  },
  setOn(v) {
    this.on = v;

  },
  tone(f0, f1, dur, vol, delay = 0, attack = 0.006, type = 'sine') {

  burst(freq, dur, vol, delay = 0) { // ざらざらした短い音

  // --- 最初の場面（試作1のまま）---
  tick(dir) { const f = 1500 + dir * 120 + Math.random() * 80; this.tone(f, f * 0.78, 0.07, 0.05); },
  appear() { this.tone(1318.5, 1318.5, 1.2, 0.035, 0, 0.08); this.tone(1975.5, 1975.5, 0.9, 0.015, 0.06, 0.08); },
  contact() {

document.addEventListener('visibilitychange', () => {

// ---------------------------------------------------------------------
//  性質
// ---------------------------------------------------------------------
const stateKey = props => props.slice().sort().join('+');
const stateOf = props => STATES[stateKey(props)];

// 混ざる：性質が入る。2つを超えたら一番古いものが押し出される。水は古い方を1つ洗い流す
function addProp(kind) {
  const p = G.player;
  let out = null;
  if (kind === 'water') { if (p.props.length) out = p.props.shift(); }
  else { p.props.push(kind); if (p.props.length > 2) out = p.props.shift(); }
  G.stats.merges[kind]++;
  Sound.merge(kind);
  if (out) {
    G.stats.ejected++;
    // 失った性質は、その色の小さな雫になって飛んでいく
    const side = G.tilt > 0.1 ? -1 : G.tilt < -0.1 ? 1 : (Math.random() < 0.5 ? -1 : 1);
    G.ejects.push({ kind: out, x: p.x + side * p.r, y: p.y, vx: side * 90, vy: -70, t: 0 });
    Sound.eject();
  }
}

// ---------------------------------------------------------------------
//  動き
// ---------------------------------------------------------------------
function step(dt) {
  update(dt);
  updateCamera();
}

function update(dt) {
  if (G.waiting) return; // 最初のタップ待ち
  G.t += dt;
  updateCtrl(dt);
  const p = G.player, f = G.friend, st = G.stats, t = G.tilt;
  if (Math.abs(t) > 0.12) {
    G.lastDir = Math.sign(t);
    if (G.firstInput < 0) { G.firstInput = G.t; st.firstInput = G.t; }
  }

  if (f.state === 'hidden') {
    let due = G.firstInput < 0 ? C.FRIEND_DELAY_MAX : Math.max(C.FRIEND_DELAY, G.firstInput + C.FRIEND_AFTER_INPUT);
    due = Math.min(due, C.FRIEND_DELAY_MAX);
    if (G.t >= due) spawnFriend();
  }

  if (G.phase === 'stuck' || G.phase === 'transfer') updateStuck(dt, t);
  else updateFree(dt, t);

  if (f.state === 'approach') updateApproach(dt);
  else if (f.state === 'touch') updateTransfer(dt);
  else if (f.state === 'leave') updateLeave(dt);

  if (G.phase === 'move' || G.phase === 'end') {
    updateOthers(dt);
    updateEffects(dt);
  }
  updateShape(p, dt);
  updateShape(f, dt);
  if (G.glowT >= 0) G.glowT += dt;
  if (G.phase === 'end' && st.zoomDone === null && G.t - G.endT - C.END_WAIT >= C.ZOOM_TIME) st.zoomDone = G.t;
}

// 動けない時の体：見えないばねで、元の位置に引き戻される（最初と、ねばねばに捕まった時）
function updateHold(dt, t, h) {
  const p = G.player;
  const dir = Math.abs(t) > 0.12 ? Math.sign(t) : 0;
  if (dir && dir !== h.prevDir) { h.offVX += dir * C.STUCK_KICK; Sound.tick(dir); } // 傾け始めた瞬間のはずみと音
  h.prevDir = dir;
  if (dir) h.anchorX = clamp(h.anchorX + t * C.STUCK_CREEP * dt, h.startX - C.STUCK_CREEP_MAX, h.startX + C.STUCK_CREEP_MAX);
  const ax = t * C.STUCK_PUSH - C.STICK_SPRING * h.offX - C.STICK_DAMP * h.offVX;
  h.offVX += ax * dt;
  h.offX += h.offVX * dt;
  h.strain = approach(h.strain, Math.min(1, Math.abs(t) / 0.6), dt * (dir ? 10 : 3));
  const tw = G.t * TAU * C.TREMBLE_HZ;
  p.x = h.anchorX + h.offX + Math.sin(tw) * C.TREMBLE * h.strain;
  p.y = h.anchorY + Math.sin(tw * 1.37 + 1) * C.TREMBLE * 0.5 * h.strain;
  return tw;
}
function stuckShape(p, h, tw) {
  p.ang = p.angT = 0;
  const pulse = 0.85 + 0.15 * Math.sin(G.t * 6.5) + 0.05 * Math.sin(tw * 0.7);
  const sag = -0.05 - 0.025 * Math.sin(G.t * 1.7);
  p.elT = h.strain * C.STRETCH_MAX * pulse + (1 - h.strain) * sag;
  p.lean = G.lastDir * Math.max(0, p.el) * p.r * 0.9;
}
function updateStuck(dt, t) {
  const p = G.player, h = G.hold;
  const tw = updateHold(dt, t, h);
  if (G.phase === 'stuck') stuckShape(p, h, tw);
  else p.lean *= Math.exp(-8 * dt);
}

// 動ける時：傾けた方へ重力がずれて流れる。動き方は性質で決まる
function updateFree(dt, t) {
  const p = G.player, st = G.stats;
  if (p.resting) { updateRest(p, dt, t); return; }
  if (G.goo) { updateGooStuck(dt, t); return; }
  const S = stateOf(p.props);
  p.lean *= Math.exp(-8 * dt);
  const ramp = smooth(clamp((G.t - G.moveT0) / G.moveRamp, 0, 1));
  const e = Math.sign(t) * Math.pow(Math.abs(t), S.curve);
  const stopped = S.stop && Math.abs(t) < C.STOP_TILT;
  let tvx = stopped ? 0 : e * S.side * C.PACE;
  let tvy = stopped ? 0 : (S.fall + S.fallTilt * Math.abs(e)) * ramp * C.PACE;
  let rx = stopped ? Math.max(S.sideResp, 9) : S.sideResp;   // 止まれる性質は、ぴたっと止まる
  let ry = stopped ? Math.max(S.fallResp, 9) : S.fallResp;
  // 蜜＋蜜：壁や岩にくっついている間は下へ進まない（離れる方へ傾ければ離れる）
  if (S.wallStick && p.stick && t * p.stick > -0.15) { tvy = 0; ry = Math.max(ry, 9); }
  // 水の流れ：入ると流される（蜜は耐える、油はもっと流される）
  const flow = streamAt(p.x, p.y);
  G.inStream = !!flow;
  if (flow) {
    const fs = C.STREAM_SPEED * S.stream * C.PACE;
    tvx += flow.dx * fs; tvy += flow.dy * fs;
    const grip = C.STREAM_GRIP * Math.min(1, S.stream * 2);
    rx = Math.max(rx, grip); ry = Math.max(ry, grip);
  }
  if (p.inGoo) { tvx *= C.GOO_OIL_SLOW; tvy *= C.GOO_OIL_SLOW; }

  if (p.escapeT > 0) {
    p.escapeT -= dt; p.escapeTotal += dt;
    tvx = p.escapeDir * 70; tvy = -35; rx = ry = 8;
  }
  p.vx += (tvx - p.vx) * (1 - Math.exp(-rx * dt));
  p.vy += (tvy - p.vy) * (1 - Math.exp(-ry * dt));
  const x0 = p.x, y0 = p.y;
  p.x += p.vx * dt;
  p.y += p.vy * dt;
  // 左右の枠
  p.stick = 0;
  const minX = p.r + 1, maxX = W - p.r - 1;
  if (p.x < minX || p.x > maxX) {
    const side = p.x < minX ? -1 : 1;
    p.x = clamp(p.x, minX, maxX);
    if (S.bounce && p.vx * side > 20) { p.vx = -p.vx * S.bounce; Sound.bar(); }  // 油＋油は跳ね返る
    else if (p.vx * side > 0) p.vx = 0;
    p.stick = side;
  }
  const blocker = collideRocks(p, S, dt, t);
  if (p.escapeT > 0 && blocker && p.escapeTotal < 3) p.escapeT = Math.max(p.escapeT, 0.15); // 岩から離れるまで続ける
  else if (blocker && !stopped && Math.hypot(p.x - x0, p.y - y0) < 4 * dt) { // 実際にほとんど動けていない
    p.stallT = (p.stallT || 0) + dt;
    if (p.stallT > C.ROCK_ESCAPE) {
      p.stallT = 0; p.escapeT = 0.45; p.escapeTotal = 0;
      p.escapeDir = p.x < W / 2 ? 1 : -1;
    }
  } else p.stallT = 0;
  touchGoo(p, S);
  if (G.goo) return;
  clean(p);
  const pane = paneOf(p.y);
  if (pane > G.playerPane) enterPane(pane);
  if (p.y + p.r >= SILL_Y) { p.y = SILL_Y - p.r; land(p); return; }
  // 形：動いている時は動く向きに伸び、止まっている時は重力の向きにかたむく
  const sp = Math.hypot(p.vx, p.vy);
  if (sp > 18) p.angT = Math.atan2(p.vy, p.vx);
  else p.angT = Math.PI / 2 - t * C.GRAVITY_SHOW_DEG * Math.PI / 180;
  p.elT = 0.08 + 0.18 * Math.min(1, sp / 120);
}

function enterPane(k) {
  G.playerPane = k;
  G.stats.paneEnter.push({ k, t: +G.t.toFixed(2), state: stateKey(G.player.props) || 'なし' });
  Sound.bar();
  G.player.elv -= 1.2;
  spawnPaneDrops(k);
}

// 岩：まるい岩はよけて転がる。砂が入っていれば削る（油＋砂・砂＋砂は一瞬で砕く）
function collideRocks(d, S, dt, t) {
  let blocker = null; // 壊せずに当たっている岩
  for (const R of G.rocks) {
    if (!R.alive || Math.abs(R.y - d.y) > R.r + d.r + 4 || Math.abs(R.x - d.x) > R.r + d.r + 4) continue;
    const rr = R.r * (0.45 + 0.55 * R.hp);
    let nx = d.x - R.x, ny = d.y - R.y;
    const dist = Math.hypot(nx, ny), min = rr + d.r;
    if (dist >= min + 1) continue;
    if (dist < 1e-6) { nx = 0; ny = -1; } else { nx /= dist; ny /= dist; }
    const canBreak = S.rock && S.rock >= R.hard;
    if (canBreak && S.smash) { breakRock(R); continue; } // 砕いて、そのまま進む
    if (canBreak) {
      R.hp -= S.erode * dt; // 削る
      if (G.t - G.erodeT > 0.11) { Sound.erode(); G.erodeT = G.t; G.crumbs.push({ x: d.x - nx * d.r, y: d.y - ny * d.r, vx: (Math.random() - 0.5) * 60, vy: -30, t: 0 }); }
      if (R.hp <= 0) { breakRock(R); continue; }
    }
    if (dist < min) { d.x += nx * (min - dist); d.y += ny * (min - dist); }
    const vn = d.vx * nx + d.vy * ny;
    if (vn < 0) { d.vx -= vn * nx; d.vy -= vn * ny; }
    if (!canBreak && ny < -0.2) blocker = R;
    if (S.wallStick) d.stick = Math.sign(R.x - d.x) || 1;
    // 止まれない雫が岩の上に乗ってしまったら、横へ転がり落ちる（壁ぎわでは壁から離れる方へ）
    if (ny < -0.4 && !S.stop && Math.abs(t) < 0.2) {
      let dir = Math.sign(d.x - R.x) || G.lastDir;
      if (d.x < d.r + 6) dir = 1; else if (d.x > W - d.r - 6) dir = -1;
      d.vx += dir * C.ROCK_NUDGE * 3 * dt;
    }
  }
  return blocker;
}
function breakRock(R) {
  R.alive = false; R.breakT = G.t;
  G.stats.rocksBroken++;
  Sound.crack();
  for (let i = 0; i < 8; i++) G.crumbs.push({ x: R.x + (Math.random() - 0.5) * R.r, y: R.y + (Math.random() - 0.5) * R.r, vx: (Math.random() - 0.5) * 120, vy: -40 - Math.random() * 60, t: 0 });
}

// 水の流れの中にいれば、流れの向きを返す
function streamAt(x, y) {
  const P = PANES[paneOf(y)];
  for (const s of P.streams) if (streamDist(s, x, y) <= C.STREAM_HW) return s;
  return null;
}

// ねばねば：油が入っていれば抜ける。ほかは捕まって動けない
function touchGoo(p, S) {
  p.inGoo = false;
  const P = PANES[paneOf(p.y)];
  for (const b of P.goo) {
    if (Math.abs(b.y - p.y) > 32 || Math.abs(b.x - p.x) > 32) continue;
    if (Math.hypot(b.x - p.x, b.y - p.y) >= p.r + b.r * 0.7) continue;
    if (S.goo) { if (!p.wasInGoo) Sound.slip(); p.inGoo = true; }
    else { startGooStuck(); break; }
  }
  p.wasInGoo = p.inGoo;
}
function startGooStuck() {
  const p = G.player;
  G.goo = { t0: G.t, startX: p.x, anchorX: p.x, anchorY: p.y, offX: 0, offVX: 0, strain: 0, prevDir: 0, rescued: false, freeAt: -1 };
  p.vx = 0; p.vy = 0;
  p.el = -p.el; p.elv = -p.elv; p.ang = p.angT = 0;
  p.elv += 3;
  G.stats.gooStuck++;
  Sound.stick();
}
// 捕まっている間は、最初と同じく、傾けると伸びて震えるが進まない。少しあとに必ず油の雫が来る
function updateGooStuck(dt, t) {
  const p = G.player, h = G.goo;
  const tw = updateHold(dt, t, h);
  stuckShape(p, h, tw);
  if (!h.rescued && G.t - h.t0 >= C.GOO_RESCUE_DELAY) {
    h.rescued = true;
    G.others.push(makeOther('oil', p.x, p.y - C.GOO_RESCUE_DIST, true));
  }
  if (h.freeAt < 0 && stateOf(p.props).goo) h.freeAt = G.t + C.MERGE_TIME;
  if (h.freeAt > 0 && G.t >= h.freeAt) {
    G.goo = null;
    G.stats.gooStuckTime += G.t - h.t0;
    p.x = h.anchorX + h.offX; p.y = h.anchorY; p.vx = 0; p.vy = 0;
    p.el = -p.el; p.elv = -p.elv; p.ang = p.angT = Math.PI / 2; p.elv += 3.5;
    G.moveT0 = G.t; G.moveRamp = 0.5;
    p.wasInGoo = true;
    Sound.slip();
  }
}

// くもりをきれいにする：ます目を数え、絵の方も消す
function clean(d) {
  if (Math.hypot(d.x - d.wx, d.y - d.wy) >= 1.5) {
    const k = paneOf(d.y);
    G.wipes.push({ k, x0: d.wx, y0: d.wy, x1: d.x, y1: d.y, w: d.r * 2 * C.CLEAN_W });
    d.wx = d.x; d.wy = d.y;
  }
  const r = d.r * C.CLEAN_W;
  const k = paneOf(d.y), P = PANES[k];
  const ly = d.y - P.top;
  if (ly < -r || ly > H + r || G.stats.revealed[k]) return;
  const i0 = Math.max(0, Math.floor((d.x - r) / C.CELL)), i1 = Math.min(NX - 1, Math.floor((d.x + r) / C.CELL));
  const j0 = Math.max(0, Math.floor((ly - r) / C.CELL)), j1 = Math.min(NY - 1, Math.floor((ly + r) / C.CELL));
  const cl = G.cleared[k];
  for (let j = j0; j <= j1; j++) {
    for (let i = i0; i <= i1; i++) {
      const idx = j * NX + i;
      if (cl[idx]) continue;
      const cx = (i + 0.5) * C.CELL, cy = (j + 0.5) * C.CELL;
      if ((cx - d.x) ** 2 + (cy - ly) ** 2 > r * r) continue;
      cl[idx] = 1;
      const v = P.kind[idx];
      if (v >= 0) G.patchClr[k][v]++; else G.normClr[k]++;
    }
  }
  if (progress(k) >= 1) revealPane(k);
}
// 見えるまでの進み具合（1で見える）：どれか1つの濃い汚れ、または、ふつうのくもり全体
function progress(k) {
  const P = PANES[k];
  let best = P.normal ? G.normClr[k] / P.normal / C.FOG_REVEAL : 0;
  P.patches.forEach((pt, n) => { best = Math.max(best, G.patchClr[k][n] / pt.cells / C.PATCH_REVEAL); });
  return Math.min(1, best);
}
function revealPane(k) {
  if (G.stats.revealed[k]) return;
  G.stats.revealed[k] = true;
  G.stats.revealT[k] = +G.t.toFixed(2);
  Sound.reveal();
}

// ---------------------------------------------------------------------
//  ほかの雫（性質の雫）
// ---------------------------------------------------------------------
function makeOther(kind, x, y, rescue) {
  const o = makeDrop(x, y, C.OTHER_R);
  o.kind = kind; o.form = 0; o.state = 'flow'; o.rescue = !!rescue;
  o.ang = o.angT = Math.PI / 2; o.phase = Math.random();
  return o;
}
function spawnPaneDrops(k) {
  if (G.spawned[k]) return;
  G.spawned[k] = true;
  for (const d of PANES[k].drops) G.others.push(makeOther(d.kind, d.x, d.y, false));
}
function updateOthers(dt) {
  const p = G.player;
  const canMerge = G.phase === 'move' && !p.resting;
  for (const o of G.others) {
    if (o.state === 'merging') {
      o.mt += dt;
      const k = Math.min(1, o.mt / C.MERGE_TIME);
      o.x = lerp(o.mx0, p.x, k * k); o.y = lerp(o.my0, p.y, k * k);
      o.r = o.mr0 * (1 - smooth(k));
      if (k >= 1) o.state = 'gone';
      continue;
    }
    if (o.state !== 'flow') continue;
    if (o.form < 1) o.form = Math.min(1, o.form + dt / C.OTHER_FORM_TIME);
    else if (o.rescue) { // 助けの油の雫は、まっすぐプレイヤーへ
      o.vx = clamp((p.x - o.x) * 3, -90, 90);
      o.vy = C.GOO_RESCUE_SPEED;
      o.x += o.vx * dt; o.y += o.vy * dt;
    } else { // ゆっくり流れて、岩・ねばねばの上や、ガラスの下の方で止まる
      const P = PANES[paneOf(o.y)];
      const ny = o.y + C.OTHER_SPEED * dt;
      const blocked = G.rocks.some(R => R.alive && Math.hypot(R.x - o.x, R.y - ny) < R.r + o.r)
        || P.goo.some(b => Math.hypot(b.x - o.x, b.y - ny) < b.r + o.r * 0.6)
        || P.streams.some(s => streamDist(s, o.x, ny) < C.STREAM_HW + o.r)
        || G.others.some(q => q !== o && q.state === 'flow' && q.y > o.y && Math.hypot(q.x - o.x, q.y - ny) < q.r + o.r);
      if (!blocked && o.y < P.top + H - o.r - 6) o.y = ny;
    }
    o.angT = Math.PI / 2; o.elT = 0.06;
    updateShape(o, dt);
    if (canMerge && Math.hypot(o.x - p.x, o.y - p.y) < o.r * easeOut(o.form) + p.r) beginMerge(o);
  }
  G.others = G.others.filter(o => o.state !== 'gone');
}
function beginMerge(o) {
  const p = G.player;
  o.state = 'merging'; o.mt = 0; o.mx0 = o.x; o.my0 = o.y; o.mr0 = o.r * easeOut(o.form);
  addProp(o.kind); // 色も動き方も、この瞬間に変わる
  p.elv -= 2.5;
  G.ripples.push({ x: (p.x + o.x) / 2, y: (p.y + o.y) / 2, t: 0, r0: p.r, kind: o.kind });
}
function updateEffects(dt) {
  for (const e of G.ejects) { e.t += dt; e.vy += 260 * dt; e.x += e.vx * dt; e.y += e.vy * dt; e.vx *= Math.exp(-1.5 * dt); }
  G.ejects = G.ejects.filter(e => e.t < 1.3);
  for (const r of G.ripples) r.t += dt;
  G.ripples = G.ripples.filter(r => r.t < 0.6);
  for (const c of G.crumbs) { c.t += dt; c.vy += 400 * dt; c.x += c.vx * dt; c.y += c.vy * dt; }
  G.crumbs = G.crumbs.filter(c => c.t < 0.8);
}

// 止まった後：傾けると少し揺れる（反応は必ず返す）
function updateRest(d, dt, t) {
  const ax = t * C.STUCK_PUSH * 0.6 - C.STICK_SPRING * d.jx - C.STICK_DAMP * d.jv;
  d.jv += ax * dt;
  d.jx += d.jv * dt;
  d.angT = Math.PI / 2;
  d.elT = -0.08;
  d.lean = 0;
}
function land(d) {
  d.resting = true;
  d.vx = 0; d.vy = 0;
  d.ang = d.angT = Math.PI / 2;
  d.elv = -6;
  d.elT = -0.08;
  G.phase = 'end'; G.endT = G.t;
  G.stats.landT = +G.t.toFixed(2);
  Sound.land();
}

// ---------------------------------------------------------------------
//  親友（試作1のまま。動けたあとは、先へ流れて見えなくなる）
// ---------------------------------------------------------------------
function spawnFriend() {
  const f = G.friend, p = G.player;
  f.state = 'approach';
  f.r = C.FRIEND_R;
  f.x = clamp(p.x + G.side * 70, f.r + 10, W - f.r - 10);
  f.y = -f.r - 2;
  f.wx = f.x; f.wy = f.y;
  f.vx = 0; f.vy = 0;
  f.ang = f.angT = Math.PI / 2;
  G.stats.friendAppear = G.t;
  Sound.appear();
}
function updateApproach(dt) {
  const f = G.friend, p = G.player, h = G.hold;
  f.vy = Math.min(C.FRIEND_APPROACH_SPEED, f.vy + C.FRIEND_APPROACH_SPEED * 2 * dt);
  const ox = f.x;
  f.y += f.vy * dt;
  const baseX = h.anchorX + h.offX;
  const tx = baseX + G.side * (p.r + f.r) * 0.55;
  f.x += (tx - f.x) * (1 - Math.exp(-2.2 * dt));
  f.vx = (f.x - ox) / dt;
  freeShape(f, f.vx);
  if (f.y > 0) clean(f);
  if (Math.hypot(f.x - baseX, f.y - h.anchorY) <= p.r + f.r) beginTransfer();
}
function beginTransfer() {
  const f = G.friend, p = G.player;
  G.phase = 'transfer';
  f.state = 'touch';
  G.transferT = 0;
  G.contactX = f.x; G.contactY = f.y;
  G.glowT = 0;
  p.el = -p.el; p.elv = -p.elv;
  p.ang = p.angT = Math.PI / 2;
  p.elT = -0.2;
  p.elv -= 2.5;
  f.elT = -0.1;
  G.stats.contact = G.t;
  Sound.contact();
}
function updateTransfer(dt) {
  const f = G.friend, p = G.player, h = G.hold;
  G.transferT += dt;
  const k = clamp(G.transferT / C.TRANSFER_TIME, 0, 1);
  const g = easeOut(k), e = smooth(k);
  p.r = lerp(C.STUCK_R, C.MOVE_R, g);
  f.r = lerp(C.FRIEND_R, C.FRIEND_R_AFTER, g);
  const baseX = h.anchorX + h.offX;
  const ox = f.x, oy = f.y;
  f.x = lerp(G.contactX, baseX + G.side * (p.r + f.r + 1), e);
  f.y = lerp(G.contactY, h.anchorY + (p.r + f.r) * 0.1, e);
  f.vx = (f.x - ox) / dt; f.vy = (f.y - oy) / dt;
  f.angT = Math.PI / 2; f.elT = -0.08;
  clean(f);
  if (k >= 1) release();
}
function release() {
  const p = G.player, f = G.friend, h = G.hold;
  G.phase = 'move';
  G.releaseT = G.t;
  G.moveT0 = G.t; G.moveRamp = C.FALL_ACCEL_TIME;
  p.r = C.MOVE_R; f.r = C.FRIEND_R_AFTER;
  p.x = h.anchorX + h.offX; p.y = h.anchorY;
  p.wx = p.x; p.wy = p.y;
  p.vx = 0; p.vy = 0;
  p.elT = 0; p.elv += 4.5;
  f.state = 'leave';
  f.vy = 60;
  G.stats.release = G.t;
  G.stats.paneEnter.push({ k: 0, t: +G.t.toFixed(2), state: 'なし' });
  Sound.release();
}
// 親友は、先へ流れていって見えなくなる（ついて行く遊びは、今回はなし）
function updateLeave(dt) {
  const f = G.friend;
  f.vy = Math.min(C.FRIEND_LEAVE_SPEED, f.vy + 160 * dt);
  f.vx *= Math.exp(-3 * dt);
  f.x += f.vx * dt;
  f.y += f.vy * dt;
  freeShape(f, f.vx);
  if (f.y < paneTop(0) + H) clean(f);
  if (f.y > paneTop(1) + 40) f.state = 'gone';
}

function freeShape(d, vxIntent) {
  const sp = Math.hypot(vxIntent, d.vy);
  if (sp > 3) d.angT = Math.atan2(d.vy, vxIntent);
  d.elT = 0.22 * Math.min(1, sp / 110);
}
function updateShape(d, dt) {
  d.ang += angDiff(d.ang, d.angT) * (1 - Math.exp(-10 * dt));
  d.elv += ((d.elT - d.el) * 170 - d.elv * 13) * dt;
  d.el = clamp(d.el + d.elv * dt, -0.5, 0.9);
}

// ---------------------------------------------------------------------
//  カメラ：ガラス1枚＝1画面。終わりに窓全体まで引く
// ---------------------------------------------------------------------
function zoomK() { return G.phase === 'end' ? smooth(clamp((G.t - G.endT - C.END_WAIT) / C.ZOOM_TIME, 0, 1)) : 0; }
function updateCamera() {
  const base = paneTop(G.playerPane) + H / 2;
  const k = zoomK();
  if (k <= 0) { cam.y = base; cam.zoom = 1; return; }
  const allTop = -C.FRAME - C.VIEW_MARGIN * 0.5, allBot = SILL_Y + C.SILL + C.VIEW_MARGIN * 0.5;
  const zAll = Math.min(sw / (W + C.FRAME * 2 + 24), sh / (allBot - allTop)) / scale;
  cam.zoom = lerp(1, Math.min(1, zAll), k);
  cam.y = lerp(base, (allTop + allBot) / 2, k);
}

// ---------------------------------------------------------------------
//  描く
// ---------------------------------------------------------------------
const ui = { icon: '', iconT: -99 };
function showIcon(kind) { ui.icon = kind; ui.iconT = performance.now() / 1000; }

// くもりを描く（1回ごと）：うすい白いくもりと、茶色く濃い汚れ
function paintFog(k) {
  const fc = fogCanvas[k], c = fc.getContext('2d'), P = PANES[k], R = C.FOG_RES;
  const rnd = prng(101 + k * 7);
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalCompositeOperation = 'source-over';
  c.clearRect(0, 0, fc.width, fc.height);
  c.setTransform(R, 0, 0, R, 0, 0);
  c.fillStyle = 'rgba(166,177,188,0.93)';
  c.fillRect(0, 0, W, H);
  for (let i = 0; i < 260; i++) { // むら
    const x = rnd() * W, y = rnd() * H, r = 6 + rnd() * 28, light = rnd() < 0.5;
    c.fillStyle = light ? `rgba(228,233,238,${0.05 + rnd() * 0.1})` : `rgba(150,158,168,${0.05 + rnd() * 0.1})`;
    c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  }
  for (let i = 0; i < 420; i++) { // 細かい水滴
    c.fillStyle = `rgba(242,246,250,${0.15 + rnd() * 0.2})`;
    c.beginPath(); c.arc(rnd() * W, rnd() * H, 0.6 + rnd() * 1.6, 0, TAU); c.fill();
  }
  for (const pt of P.patches) { // 濃い汚れ
    for (let i = 0; i < 70; i++) {
      const a = rnd() * TAU, q = Math.sqrt(rnd()) * 0.92;
      const x = pt.x + Math.cos(a) * pt.rx * q, y = pt.y + Math.sin(a) * pt.ry * q;
      c.fillStyle = `rgba(${104 + rnd() * 20},${86 + rnd() * 14},${62 + rnd() * 12},0.5)`;
      c.beginPath(); c.arc(x, y, 7 + rnd() * 13, 0, TAU); c.fill();
    }
    for (let i = 0; i < 40; i++) {
      const a = rnd() * TAU, q = Math.sqrt(rnd());
      c.fillStyle = `rgba(52,40,28,${0.3 + rnd() * 0.3})`;
      c.beginPath(); c.arc(pt.x + Math.cos(a) * pt.rx * q, pt.y + Math.sin(a) * pt.ry * q, 0.8 + rnd() * 2.2, 0, TAU); c.fill();
    }
  }
  // 水の流れの所は、もともときれい
  c.globalCompositeOperation = 'destination-out';
  c.lineCap = 'round';
  for (const s of P.streams) {
    c.lineWidth = C.STREAM_HW * 2;
    c.beginPath(); c.moveTo(s.x0, s.y0 - P.top); c.lineTo(s.x1, s.y1 - P.top); c.stroke();
  }
  c.globalCompositeOperation = 'source-over';
}
// 雫が通った所のくもりを消す（描く時にまとめて）
function flushWipes() {
  if (!G.wipes.length) return;
  for (const w of G.wipes) {
    const P = PANES[w.k], c = fogCanvas[w.k].getContext('2d'), R = C.FOG_RES;
    c.setTransform(R, 0, 0, R, 0, 0);
    c.globalCompositeOperation = 'destination-out';
    c.lineCap = 'round';
    c.strokeStyle = 'rgba(0,0,0,0.45)'; c.lineWidth = w.w * 1.3;
    c.beginPath(); c.moveTo(w.x0, w.y0 - P.top); c.lineTo(w.x1, w.y1 - P.top); c.stroke();
    c.strokeStyle = 'rgba(0,0,0,1)'; c.lineWidth = w.w;
    c.beginPath(); c.moveTo(w.x0, w.y0 - P.top); c.lineTo(w.x1, w.y1 - P.top); c.stroke();
    c.globalCompositeOperation = 'source-over';
  }
  G.wipes.length = 0;
}
function fogAlpha(k) {
  const rt = G.stats.revealT[k];
  if (rt !== null) return Math.max(0, 1 - (G.t - rt) / C.REVEAL_FADE);
  return 1 - C.FOG_THIN * progress(k);
}

function worldTransform(total) {
  ctx.translate(sw / 2, sh / 2);
  ctx.scale(total, total);
  ctx.translate(-W / 2, -cam.y);
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = COL.wall;
  ctx.fillRect(0, 0, sw, sh);
  flushWipes();
  const total = scale * cam.zoom;
  const zk = zoomK();
  ctx.save();
  worldTransform(total);
  const top = cam.y - sh / 2 / total - 40, bot = cam.y + sh / 2 / total + 40;
  for (const P of PANES) {
    if (P.top > bot || P.top + H < top) continue;
    ctx.drawImage(sceneCanvas[P.k], 0, P.top, W, H);              // 向こうの部屋
    ctx.fillStyle = 'rgba(30,45,62,0.12)'; ctx.fillRect(0, P.top, W, H); // ガラスの色
    const fa = fogAlpha(P.k);
    if (fa > 0.001) { ctx.globalAlpha = fa; ctx.drawImage(fogCanvas[P.k], 0, P.top, W, H); ctx.globalAlpha = 1; }
    drawStreams(P);
  }
  drawGoo(top, bot);
  drawRocks(top, bot);
  // 桟と下の枠
  for (let k = 0; k < C.PANE_COUNT - 1; k++) {
    const y0 = paneTop(k) + H;
    if (y0 > bot || y0 + C.BAR < top) continue;
    ctx.fillStyle = COL.frame; ctx.fillRect(0, y0, W, C.BAR);
    ctx.fillStyle = COL.frameEdge; ctx.fillRect(0, y0, W, 2);
  }
  ctx.fillStyle = COL.frame; ctx.fillRect(-C.FRAME, SILL_Y, W + C.FRAME * 2, C.SILL);
  ctx.fillStyle = COL.frameEdge; ctx.fillRect(0, SILL_Y, W, 2.5);
  // ほかの雫
  for (const o of G.others) {
    if (o.y < top - 30 || o.y > bot + 30) continue;
    if (o.state === 'merging') drawMergeBridge(o);
    const r = o.state === 'merging' ? o.r : o.r * easeOut(o.form);
    if (r > 0.3) drawDrop(o, o.state === 'merging' ? 1 : o.form, r, [o.kind], o.phase);
  }
  for (const e of G.ejects) drawDrop({ x: e.x, y: e.y, ang: Math.PI / 2, el: 0.1, lean: 0, jx: 0, resting: false }, 1 - e.t / 1.3, 6, [e.kind], 0.3);
  for (const c of G.crumbs) {
    ctx.fillStyle = `rgba(110,98,86,${1 - c.t / 0.8})`;
    ctx.fillRect(c.x - 1.6, c.y - 1.6, 3.2, 3.2);
  }
  // 親友
  const f = G.friend;
  if (f.state !== 'hidden' && f.state !== 'gone') {
    if (f.state === 'touch') drawBridge();
    drawDrop(f, FRIEND_ALPHA, f.r, []);
  }
  // 上と左右の枠
  ctx.fillStyle = COL.frame;
  ctx.fillRect(-C.FRAME, -C.FRAME, W + C.FRAME * 2, C.FRAME);
  ctx.fillRect(-C.FRAME, 0, C.FRAME, SILL_Y);
  ctx.fillRect(W, 0, C.FRAME, SILL_Y);
  // 場面が見えた瞬間の光
  for (const P of PANES) {
    const rt = G.stats.revealT[P.k];
    if (rt === null) continue;
    const age = G.t - rt;
    if (age < 0.9) {
      ctx.fillStyle = `rgba(255,248,225,${0.55 * (1 - age / 0.9) ** 2})`;
      ctx.fillRect(0, P.top, W, H);
    }
    // 終わり：見えた場面は、ふちが明るく光る
    if (zk > 0.6) {
      ctx.strokeStyle = `rgba(255,226,150,${(zk - 0.6) / 0.4 * (0.55 + 0.25 * Math.sin(G.t * 3 + P.k))})`;
      ctx.lineWidth = 6;
      ctx.strokeRect(-3, P.top - 3, W + 6, H + 6);
    }
  }
  ctx.restore();

  // A：今のガラスと、そのまわりの枠だけを見せる（終わりに引く時は、全部見せる）
  if (zk <= 0) {
    const k = G.playerPane;
    const toY = y => (y - cam.y) * total + sh / 2;
    const yTop = Math.floor(toY(paneTop(k) - (k === 0 ? C.FRAME : C.BAR)));
    const yBot = Math.ceil(toY(paneTop(k) + H + (k === C.PANE_COUNT - 1 ? C.SILL : C.BAR)));
    ctx.fillStyle = COL.wall;
    if (yTop > 0) ctx.fillRect(0, 0, sw, yTop);
    if (yBot < sh) ctx.fillRect(0, yBot, sw, sh - yBot);
  }

  ctx.save();
  worldTransform(total);
  drawGlow();
  drawRipples();
  drawDrop(G.player, 1, G.player.r, G.player.props, 0);
  ctx.restore();

  if (canRestartByTap()) { // もう一度：小さな雫が、息をするように光る
    const a = 0.25 + 0.18 * Math.sin(performance.now() / 1000 * 2.4);
    ctx.fillStyle = `rgba(${COL.drop},${a})`;
    ctx.beginPath(); ctx.arc(sw / 2, sh - 26, 7, 0, TAU); ctx.fill();
  }
  if (G.waiting) drawStartOverlay();
  drawIcon();
}

function drawStreams(P) {
  if (!P.streams.length) return;
  const tm = G.t;
  for (const s of P.streams) {
    const nx = -s.dy, ny = s.dx;
    ctx.fillStyle = 'rgba(150,200,235,0.16)';
    ctx.beginPath();
    ctx.moveTo(s.x0 + nx * C.STREAM_HW, s.y0 + ny * C.STREAM_HW);
    ctx.lineTo(s.x1 + nx * C.STREAM_HW, s.y1 + ny * C.STREAM_HW);
    ctx.lineTo(s.x1 - nx * C.STREAM_HW, s.y1 - ny * C.STREAM_HW);
    ctx.lineTo(s.x0 - nx * C.STREAM_HW, s.y0 - ny * C.STREAM_HW);
    ctx.closePath(); ctx.fill();
    // 流れていく筋（流れの向きが分かるように動く）
    ctx.strokeStyle = 'rgba(225,242,255,0.45)';
    ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (let i = 0; i < 7; i++) {
      const off = (i - 3) * C.STREAM_HW * 0.27;
      const ph = ((tm * C.STREAM_SPEED * 0.6 + i * 53) % s.len);
      for (let q = 0; q < 3; q++) {
        const a = (ph + q * s.len / 3) % s.len;
        const x = s.x0 + s.dx * a + nx * off, y = s.y0 + s.dy * a + ny * off;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + s.dx * 18, y + s.dy * 18); ctx.stroke();
      }
    }
  }
}
function drawGoo(top, bot) {
  for (const P of PANES) {
    if (!P.goo.length || P.top > bot || P.top + H < top) continue;
    for (const b of P.goo) {
      ctx.fillStyle = 'rgba(74,92,36,0.88)';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    }
    for (const b of P.goo) { // ぬらっとした光
      const wob = Math.sin(G.t * 1.5 + b.ph) * 1.5;
      ctx.fillStyle = 'rgba(190,210,120,0.35)';
      ctx.beginPath(); ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.35 + wob * 0.3, b.r * 0.28, 0, TAU); ctx.fill();
    }
  }
}
function drawRocks(top, bot) {
  for (const R of G.rocks) {
    if (!R.alive || R.y < top - 30 || R.y > bot + 30) continue;
    const rr = R.r * (0.45 + 0.55 * R.hp);
    ctx.beginPath();
    for (let i = 0; i < R.jag.length; i++) {
      const a = R.rot + i / R.jag.length * TAU, q = rr * R.jag[i];
      const x = R.x + Math.cos(a) * q, y = R.y + Math.sin(a) * q;
      if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = R.hard === 2 ? '#4b4f5c' : '#7a6c5d'; // 固い岩は青黒く、ふつうの岩は茶色っぽく
    ctx.fill();
    ctx.strokeStyle = R.hard === 2 ? 'rgba(150,160,185,0.55)' : 'rgba(190,170,145,0.5)';
    ctx.lineWidth = R.hard === 2 ? 2.4 : 1.4;
    ctx.stroke();
    if (R.hp < 1) { // 削れたひび
      ctx.strokeStyle = 'rgba(30,24,18,0.6)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(R.x - rr * 0.5, R.y - rr * 0.2); ctx.lineTo(R.x, R.y + rr * 0.1); ctx.lineTo(R.x + rr * 0.4, R.y - rr * 0.3); ctx.stroke();
    }
  }
}

// 雫を描く。props があれば、その色（2つの時は、真ん中が新しい方・ふちが古い方）
function drawDrop(d, a, rr, props, phase) {
  const s = 1 + d.el, inv = 1 / s;
  const cx = d.x + (d.lean || 0) + (d.jx || 0);
  const cy = d.y + (d.resting ? -rr * d.el : 0);
  const ca = Math.cos(d.ang), sa = Math.sin(d.ang);
  const rx = rr * Math.hypot(s * ca, inv * sa);
  const ry = rr * Math.hypot(s * sa, inv * ca);
  ctx.fillStyle = `rgba(8,12,16,${0.22 * a})`;
  ctx.beginPath(); ctx.ellipse(cx + rr * 0.1, cy + rr * 0.18, rr * s, rr * inv, d.ang, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx, cy, rr * s, rr * inv, d.ang, 0, TAU);
  const kinds = (props || []).filter(k => k !== 'water' || props.length === 1);
  if (!kinds.length) {
    ctx.fillStyle = `rgba(${COL.drop},${0.34 * a})`;
  } else {
    const inner = propRGB(kinds[kinds.length - 1], phase), outer = propRGB(kinds[0], phase + 0.5);
    const op = kinds[0] === 'water' ? 0.45 : 0.85;
    const g = ctx.createRadialGradient(cx - rr * 0.15, cy - rr * 0.15, rr * 0.1, cx, cy, rr * 1.05);
    g.addColorStop(0, `rgba(${inner[0]},${inner[1]},${inner[2]},${op * a})`);
    g.addColorStop(kinds.length > 1 ? 0.45 : 0.7, `rgba(${inner[0]},${inner[1]},${inner[2]},${op * a})`);
    g.addColorStop(1, `rgba(${outer[0]},${outer[1]},${outer[2]},${op * a})`);
    ctx.fillStyle = g;
  }
  ctx.fill();
  ctx.lineWidth = Math.max(1.1 / scale, rr * 0.09);
  ctx.strokeStyle = `rgba(${COL.light},${0.55 * a})`; ctx.stroke();
  if (kinds.includes('sand')) { // 砂のつぶ
    ctx.fillStyle = `rgba(60,38,18,${0.6 * a})`;
    for (const [qx, qy] of [[-0.35, 0.15], [0.25, 0.3], [0.05, -0.3], [0.4, -0.1], [-0.15, 0.45]]) {
      ctx.beginPath(); ctx.arc(cx + qx * rx, cy + qy * ry, Math.max(0.8, rr * 0.08), 0, TAU); ctx.fill();
    }
  }
  ctx.fillStyle = `rgba(${COL.light},${0.2 * a})`;
  ctx.beginPath(); ctx.ellipse(cx, cy + ry * 0.38, rx * 0.5, ry * 0.36, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = `rgba(255,255,255,${0.85 * a})`;
  ctx.beginPath(); ctx.arc(cx - rx * 0.36, cy - ry * 0.4, Math.min(rx, ry) * 0.2, 0, TAU); ctx.fill();
}

function drawBridge() {
  const p = G.player, f = G.friend;
  const k = clamp(G.transferT / C.TRANSFER_TIME, 0, 1);
  const fade = 1 - smooth(clamp((k - 0.7) / 0.3, 0, 1));
  if (fade <= 0) return;
  ctx.fillStyle = `rgba(${COL.drop},0.34)`;
  ctx.beginPath();
  for (let i = 1; i <= 5; i++) {
    const u = i / 6;
    const x = lerp(p.x, f.x, u), y = lerp(p.y, f.y, u);
    const r = lerp(p.r, f.r, u) * (0.42 + 0.35 * Math.abs(2 * u - 1)) * fade;
    ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU);
  }
  ctx.fill();
  if (k < 0.85) {
    ctx.fillStyle = `rgba(${COL.light},0.75)`;
    for (let i = 0; i < 3; i++) {
      const u = 1 - ((G.transferT * 2.2 + i / 3) % 1);
      ctx.beginPath(); ctx.arc(lerp(p.x, f.x, u), lerp(p.y, f.y, u), 1.4 + 1.2 * (1 - u), 0, TAU); ctx.fill();
    }
  }
}
function drawMergeBridge(o) {
  const p = G.player;
  const k = Math.min(1, o.mt / C.MERGE_TIME);
  const c = propRGB(o.kind, o.phase);
  ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},0.5)`;
  ctx.beginPath();
  for (let i = 1; i <= 4; i++) {
    const u = i / 5;
    const x = lerp(p.x, o.x, u), y = lerp(p.y, o.y, u);
    const r = lerp(p.r, Math.max(o.r, 1), u) * (0.55 + 0.3 * Math.abs(2 * u - 1)) * (1 - 0.5 * k);
    ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU);
  }
  ctx.fill();
}
function drawRipples() {
  for (const r of G.ripples) {
    const h = r.t / 0.6;
    const c = r.kind ? propRGB(r.kind, 0) : [238, 245, 250];
    ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},${0.6 * (1 - h)})`;
    ctx.lineWidth = Math.max(1.2 / scale, 2.2 * (1 - h) + 0.5);
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 * (1 + 1.6 * easeOut(h)), 0, TAU); ctx.stroke();
  }
}
function drawGlow() {
  if (G.glowT < 0 || G.glowT > C.GLOW_TIME) return;
  const p = G.player, g = G.glowT / C.GLOW_TIME;
  const R = p.r * 4;
  const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
  grad.addColorStop(0, `rgba(255,255,255,${0.42 * (1 - g)})`);
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, TAU); ctx.fill();
  for (const delay of [0, 0.18]) {
    const h = clamp((g - delay) / (1 - delay), 0, 1);
    if (h <= 0 || h >= 1) continue;
    const rr = p.r * (1 + (C.GLOW_RING - 1) * easeOut(h));
    ctx.strokeStyle = `rgba(255,255,255,${0.55 * (1 - h) * (1 - h) * (delay ? 0.6 : 1)})`;
    ctx.lineWidth = Math.max(1.4 / scale, 2.4 * (1 - h) + 0.5);
    ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, TAU); ctx.stroke();
  }
}

// 最初の画面：傾いたスマホの印（タップで始まる）
function drawStartOverlay() {
  ctx.fillStyle = 'rgba(10,14,18,0.55)';
  ctx.fillRect(0, 0, sw, sh);
  const tm = performance.now() / 1000;
  const cx = sw / 2, cy = sh / 2, w = 58, h = 104;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(Math.sin(tm * 1.8) * 0.3);
  ctx.strokeStyle = 'rgba(238,245,250,0.9)'; ctx.lineWidth = 3;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-w / 2, -h / 2, w, h, 10); else ctx.rect(-w / 2, -h / 2, w, h);
  ctx.stroke();
  // 画面の中の雫（傾いた方へ寄る）
  ctx.fillStyle = 'rgba(190,210,226,0.85)';
  ctx.beginPath(); ctx.arc(Math.sin(tm * 1.8) * 14, 6, 8, 0, TAU); ctx.fill();
  ctx.restore();
  // 押せる印：広がる輪
  const k = (tm * 0.8) % 1;
  ctx.strokeStyle = `rgba(238,245,250,${0.5 * (1 - k)})`; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy + h / 2 + 34, 8 + k * 16, 0, TAU); ctx.stroke();
  ctx.fillStyle = 'rgba(238,245,250,0.85)';
  ctx.beginPath(); ctx.arc(cx, cy + h / 2 + 34, 7, 0, TAU); ctx.fill();
}

// 切り替えた時だけ、右上に小さな印（文字は出さない）
function drawIcon() {
  const age = performance.now() / 1000 - ui.iconT;
  if (age > 1.8) return;
  const a = clamp((1.8 - age) / 0.6, 0, 1) * 0.85;
  ctx.strokeStyle = ctx.fillStyle = `rgba(${COL.light},${a})`;
  ctx.lineWidth = 2;
  if (ui.icon === 'touch') { // タッチ操作に変わった：画面の左半分と右半分
    ctx.strokeRect(10, 10, sw / 2 - 15, sh - 20);
    ctx.strokeRect(sw / 2 + 5, 10, sw / 2 - 15, sh - 20);
    return;
  }
  const x = sw - 44, y = 20, s = 24;
  if (ui.icon === 'soundOn') {
    ctx.beginPath(); ctx.arc(x + s / 2, y + s / 2, 4, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(x + s / 2, y + s / 2, 8, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + s / 2, y + s / 2, 12.5, 0, TAU); ctx.stroke();
  } else if (ui.icon === 'soundOff') {
    ctx.beginPath(); ctx.arc(x + s / 2, y + s / 2, 4, 0, TAU); ctx.stroke();
  }
}

// ---------------------------------------------------------------------
//  向こうの部屋の絵（親友の暮らし）
// ---------------------------------------------------------------------
const SKIN = '#f1c7a5', HAIR = '#3b2a20', SWEATER = '#3a9d96', PANTS = '#34495e';
function rr(c, x, y, w, h, r, fill) {
  c.beginPath();
  if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h);
  c.fillStyle = fill; c.fill();
}
function circ(c, x, y, r, fill) { c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = fill; c.fill(); }
function ell(c, x, y, rx, ry, fill, rot = 0) { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); c.fillStyle = fill; c.fill(); }
function room(c, wall, floor, warm = true) {
  c.fillStyle = wall; c.fillRect(0, 0, W, H);
  const g = c.createRadialGradient(180, 220, 30, 180, 260, 380);
  g.addColorStop(0, warm ? 'rgba(255,238,200,0.35)' : 'rgba(120,140,200,0.12)');
  g.addColorStop(1, 'rgba(0,0,0,0.28)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.fillStyle = floor; c.fillRect(0, 470, W, 50);
  c.fillStyle = 'rgba(0,0,0,0.18)'; c.fillRect(0, 466, W, 4);
}
function headSide(c, x, y, r, facing) { // 横向きの顔
  circ(c, x, y, r, SKIN);
  c.beginPath(); c.arc(x - facing * r * 0.15, y - r * 0.1, r * 1.02, Math.PI * (facing > 0 ? 0.95 : -0.05), Math.PI * (facing > 0 ? 2.05 : 1.05)); c.fillStyle = HAIR; c.fill();
  circ(c, x + facing * r * 0.5, y + r * 0.05, r * 0.11, '#2b2b2b');
}
function drawScene(c, name) {
  if (name === 'window') { // 窓辺に立っている（後ろ姿）
    room(c, '#e9d7b6', '#8a5a3c');
    c.fillStyle = '#f4eee4'; c.fillRect(80, 80, 200, 230);
    const sky = c.createLinearGradient(0, 90, 0, 300); sky.addColorStop(0, '#16224a'); sky.addColorStop(1, '#3a4f86');
    c.fillStyle = sky; c.fillRect(90, 90, 180, 210);
    circ(c, 235, 135, 18, '#f6e7a1');
    for (const [x, y] of [[120, 120], [150, 160], [205, 105], [255, 210], [110, 240]]) circ(c, x, y, 1.6, '#e8ecff');
    c.fillStyle = '#f4eee4'; c.fillRect(176, 90, 8, 210); c.fillRect(90, 190, 180, 8);
    c.fillStyle = '#6b4a2e'; c.fillRect(55, 66, 250, 6);
    for (const x0 of [62, 264]) { c.fillStyle = '#b5473a'; c.fillRect(x0, 70, 34, 262); c.fillStyle = 'rgba(0,0,0,0.15)'; c.fillRect(x0 + 10, 70, 4, 262); c.fillRect(x0 + 22, 70, 4, 262); }
    ell(c, 180, 495, 120, 14, '#c98b6b');
    rr(c, 164, 408, 14, 64, 4, PANTS); rr(c, 182, 408, 14, 64, 4, PANTS);
    rr(c, 160, 466, 20, 8, 3, '#222'); rr(c, 180, 466, 20, 8, 3, '#222');
    rr(c, 148, 316, 64, 100, 16, SWEATER);
    rr(c, 136, 324, 16, 76, 8, SWEATER); rr(c, 208, 324, 16, 76, 8, SWEATER);
    circ(c, 144, 402, 8, SKIN); circ(c, 216, 402, 8, SKIN);
    circ(c, 180, 292, 25, HAIR); circ(c, 156, 296, 5, SKIN); circ(c, 204, 296, 5, SKIN);
    c.beginPath(); c.moveTo(304, 470); c.lineTo(340, 470); c.lineTo(344, 432); c.lineTo(300, 432); c.closePath(); c.fillStyle = '#b5653a'; c.fill();
    for (const [x, y, rot] of [[312, 410, -0.5], [330, 402, 0.4], [322, 390, 0]]) ell(c, x, y, 9, 20, '#4f9a4a', rot);
  } else if (name === 'tv') { // テレビの前に座っている
    room(c, '#d8cbe6', '#7d5a44');
    c.save(); c.globalAlpha = 0.5; c.fillStyle = '#9fd8ff'; c.beginPath(); c.ellipse(275, 470, 110, 20, 0, 0, TAU); c.fill(); c.restore();
    rr(c, 205, 420, 140, 50, 4, '#5a4030'); c.fillStyle = '#3e2c21'; c.fillRect(215, 436, 120, 3);
    rr(c, 215, 300, 125, 118, 6, '#16181c');
    const scr = c.createLinearGradient(0, 308, 0, 404); scr.addColorStop(0, '#5ec8ff'); scr.addColorStop(1, '#2a6fd1');
    rr(c, 223, 308, 109, 96, 3, scr);
    circ(c, 254, 336, 12, '#ffd34d'); ell(c, 292, 400, 50, 22, '#4caf50'); ell(c, 300, 334, 16, 7, '#ffffff');
    rr(c, 20, 400, 165, 58, 12, '#d39b2c'); rr(c, 12, 322, 44, 130, 14, '#c48a22'); rr(c, 168, 382, 28, 74, 12, '#c48a22');
    rr(c, 84, 338, 54, 70, 16, SWEATER);
    rr(c, 120, 392, 62, 20, 9, PANTS); rr(c, 170, 400, 18, 60, 7, PANTS);
    headSide(c, 112, 316, 22, 1);
    rr(c, 126, 362, 42, 13, 6, SWEATER); circ(c, 168, 368, 7, SKIN); rr(c, 170, 360, 14, 8, 2, '#333');
    c.fillStyle = '#7a5a3a'; c.fillRect(40, 140, 4, 180); c.beginPath(); c.moveTo(22, 140); c.lineTo(62, 140); c.lineTo(52, 110); c.lineTo(32, 110); c.closePath(); c.fillStyle = '#f3d9a0'; c.fill();
  } else if (name === 'desk') { // 机で何かを書いている（左右を入れ替えて描く：机が右）
    c.save(); c.translate(W, 0); c.scale(-1, 1);
    room(c, '#cfe2d6', '#7b5b45');
    rr(c, 228, 110, 112, 232, 4, '#8a6243');
    const cols = ['#c0392b', '#2e86c1', '#f1c40f', '#27ae60', '#8e44ad', '#e67e22', '#16a085'];
    for (const [sy, n] of [[118, 8], [176, 7], [234, 8], [292, 6]]) {
      c.fillStyle = '#6b4a30'; c.fillRect(232, sy + 48, 104, 6);
      let x = 236;

// ---------------------------------------------------------------------
//  まわす
// ---------------------------------------------------------------------
const DT = 1 / 120;
let lastNow = performance.now(), acc = 0;
function frame(now) {
  if (window.innerWidth !== sw || window.innerHeight !== sh) resize();
  let dt = (now - lastNow) / 1000;
  lastNow = now;
  dt = paused ? 0 : clamp(dt, 0, 0.1);
  acc += dt;
  let n = 0;
  while (acc >= DT && n < 15) { step(DT); acc -= DT; n++; }
  if (n >= 15) acc = 0;
  const p = G.player;
  const moving = G.phase === 'move' && !p.resting && !G.goo;
  Sound.slide(moving ? Math.min(1, Math.hypot(p.vx, p.vy) / 110) : 0, moving && G.inStream);
  draw();
  requestAnimationFrame(frame);
}

addEventListener('resize', resize);
resize();
buildCanvases();
newGame();
requestAnimationFrame(frame);

// ---------------------------------------------------------------------
//  確かめ用（ブラウザの開発ツールから __shizuku で使う。遊ぶ人には見えない）
// ---------------------------------------------------------------------
window.__shizuku = {
  CONFIG, STATES, PANES, cam, Sound, ctrl,
  stateKey, stateOf, progress,
  get G() { return G; },
  get paused() { return paused; },
  set paused(v) { paused = !!v; },
  restart: newGame,
  draw,
  // 早送りで遊ぶ。controller(G) が傾き（-1〜1）を返す
  sim(seconds, controller, dt = DT) {
    simulating = true;
    G.waiting = false;
    try {
      const n = Math.round(seconds / dt);
      for (let i = 0; i < n; i++) { testTilt = controller ? controller(G) : 0; step(dt); if (G.stats.zoomDone !== null) break; }
    } finally { testTilt = null; simulating = false; }
    return this.summary();
  },
  summary() {
    const s = G.stats;
    return Object.assign({}, s, {
      revealedCount: s.revealed.filter(Boolean).length,
      progress: PANES.map(P => +progress(P.k).toFixed(2)),
      props: stateKey(G.player.props) || 'なし',
      phase: G.phase, t: +G.t.toFixed(2),
      playTime: s.landT, // 下の枠に着くまで
    });
  },
};
